name = "streamerstickpro-live"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# pages_build_output_dir is INTENTIONALLY omitted.
# Per Cloudflare docs: without this key, wrangler.toml is "local development only"
# and Dashboard environment variables + secrets are NOT overridden.
# The GitHub Actions workflow specifies "dist" directly in the wrangler command.
#
# ALL environment variables (public + secrets) are managed in the Cloudflare Dashboard:
#   Workers & Pages → streamerstickpro-live → Settings → Environment variables
