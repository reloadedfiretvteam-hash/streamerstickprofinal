NODE_ENV = "production"
RESEND_FROM_EMAIL = "noreply@streamstickpro.com"
VITE_SUPABASE_URL = "https://emlqlmfzqsnqokrqvmcm.supabase.co"
VITE_SUPABASE_ANON_KEY = "sb_publishable_BkyZ4tI3yVw04QBkAmZjXw_fhy0Y7LzJ-4tTvLSlElxowyyuQGDQRBQsiCOD1YquEtRgISm"
VITE_SECURE_HOSTS = "secure.streamstickpro.com"
VITE_STORAGE_BUCKET_NAME = "imiges"
SITE_URL = "https://streamstickpro.com"

# SECRETS - Set in Cloudflare Pages Dashboard → Settings → Environment Variables (Production)
# Worker needs these at RUNTIME to talk to Supabase (SEO tables, redirect_map, blog). Same values as GitHub Secrets.
# Required:
#   SUPABASE_SERVICE_KEY - Supabase service_role key (Worker reads seo_architecture, redirect_map, etc.)
#   ADMIN_USERNAME - Admin login username
#   ADMIN_PASSWORD - Admin login password
#   STRIPE_SECRET_KEY - Stripe API secret key
#   STRIPE_PUBLISHABLE_KEY - Stripe publishable key
#   STRIPE_WEBHOOK_SECRET - Stripe webhook signing secret
#   RESEND_API_KEY - Resend email API key
#   SESSION_SECRET - Session encryption key
#
# Optional (for retargeting):
#   VITE_GOOGLE_ADS_ID - Google Ads conversion tracking ID
#   VITE_FACEBOOK_PIXEL_ID - Facebook Pixel ID

# NOTE: Cron triggers for Cloudflare Pages must be configured in the Dashboard:
#   Workers & Pages → Your Project → Settings → Triggers → Add Cron Trigger
#   Schedule: 0 */6 * * * (every 6 hours)
#   This will call /cron/email-campaigns endpoint automatically