name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - clean-main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Supabase migrations (if DATABASE_URL is set)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Install psql client to run migrations
          which psql && psql "$DATABASE_URL" -f supabase/migrations/20260421000001_add_missing_order_columns.sql && echo "Migration applied" || echo "Migration step skipped (psql not available or migration already applied)"
        continue-on-error: true

      - name: Build for Cloudflare Workers
        run: npx tsx script/build-worker.ts
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_ADS_ID: ${{ secrets.VITE_GOOGLE_ADS_ID }}
          VITE_GOOGLE_ADS_CONVERSION_LABEL: ${{ secrets.VITE_GOOGLE_ADS_CONVERSION_LABEL }}
          VITE_SECURE_HOSTS: secure.streamstickpro.com
          VITE_STORAGE_BUCKET_NAME: imiges
          VITE_WP_ORIGIN: ${{ secrets.WP_ORIGIN }}
          VITE_WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          NODE_ENV: production
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLL_KEY: ${{ secrets.SUPABASE_SERVICE_ROLL_KEY }}

      - name: Sync secrets to Cloudflare Pages
        continue-on-error: true
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${{ secrets.STRIPE_SECRET_KEY }}" ]; then
            echo "${{ secrets.STRIPE_SECRET_KEY }}" | npx wrangler pages secret put STRIPE_SECRET_KEY --project-name=streamerstickpro-live
          fi
          if [ -n "${{ secrets.STRIPE_PUBLISHABLE_KEY }}" ]; then
            echo "${{ secrets.STRIPE_PUBLISHABLE_KEY }}" | npx wrangler pages secret put STRIPE_PUBLISHABLE_KEY --project-name=streamerstickpro-live
          fi
          if [ -n "${{ secrets.STRIPE_WEBHOOK_SECRET }}" ]; then
            echo "${{ secrets.STRIPE_WEBHOOK_SECRET }}" | npx wrangler pages secret put STRIPE_WEBHOOK_SECRET --project-name=streamerstickpro-live
          fi
          if [ -n "${{ secrets.SUPABASE_SERVICE_KEY }}" ]; then
            echo "${{ secrets.SUPABASE_SERVICE_KEY }}" | npx wrangler pages secret put SUPABASE_SERVICE_KEY --project-name=streamerstickpro-live
          fi
          if [ -n "${{ secrets.RESEND_API_KEY }}" ]; then
            echo "${{ secrets.RESEND_API_KEY }}" | npx wrangler pages secret put RESEND_API_KEY --project-name=streamerstickpro-live
          fi
          if [ -n "${{ secrets.SESSION_SECRET }}" ]; then
            echo "${{ secrets.SESSION_SECRET }}" | npx wrangler pages secret put SESSION_SECRET --project-name=streamerstickpro-live
          fi
          if [ -n "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "${{ secrets.VITE_SUPABASE_ANON_KEY }}" | npx wrangler pages secret put VITE_SUPABASE_ANON_KEY --project-name=streamerstickpro-live
          fi
          if [ -n "${{ secrets.RESEND_FROM_EMAIL }}" ]; then
            echo "${{ secrets.RESEND_FROM_EMAIL }}" | npx wrangler pages secret put RESEND_FROM_EMAIL --project-name=streamerstickpro-live
          fi
          if [ -n "${{ secrets.SUPABASE_DATABASE_URL }}" ]; then
            echo "${{ secrets.SUPABASE_DATABASE_URL }}" | npx wrangler pages secret put DATABASE_URL --project-name=streamerstickpro-live
          fi
          # Admin credentials (override fallback in auth.ts)
          if [ -n "${{ secrets.ADMIN_USERNAME }}" ]; then
            echo "${{ secrets.ADMIN_USERNAME }}" | npx wrangler pages secret put ADMIN_USERNAME --project-name=streamerstickpro-live
          fi
          if [ -n "${{ secrets.ADMIN_PASSWORD }}" ]; then
            echo "${{ secrets.ADMIN_PASSWORD }}" | npx wrangler pages secret put ADMIN_PASSWORD --project-name=streamerstickpro-live
          fi
          if [ -n "${{ secrets.JWT_SECRET }}" ]; then
            echo "${{ secrets.JWT_SECRET }}" | npx wrangler pages secret put JWT_SECRET --project-name=streamerstickpro-live
          fi
          # IPTV panel (automatic free trials): add these in GitHub → Settings → Secrets and variables → Actions.
          # Only runs when a secret is non-empty so existing deploys are unchanged until you add them.
          # Never commit real API keys; rotate any key that was pasted into chat or issues.
          if [ -n "${{ secrets.IPTV_PANEL_API_BASE }}" ]; then
            echo "${{ secrets.IPTV_PANEL_API_BASE }}" | npx wrangler pages secret put IPTV_PANEL_API_BASE --project-name=streamerstickpro-live
          fi
          if [ -n "${{ secrets.IPTV_PANEL_API_KEY }}" ]; then
            echo "${{ secrets.IPTV_PANEL_API_KEY }}" | npx wrangler pages secret put IPTV_PANEL_API_KEY --project-name=streamerstickpro-live
          fi
          if [ -n "${{ secrets.IPTV_PANEL_TRIAL_PACKAGE }}" ]; then
            echo "${{ secrets.IPTV_PANEL_TRIAL_PACKAGE }}" | npx wrangler pages secret put IPTV_PANEL_TRIAL_PACKAGE --project-name=streamerstickpro-live
          fi
          if [ -n "${{ secrets.IPTV_PANEL_TRIAL_EXP_DAYS }}" ]; then
            echo "${{ secrets.IPTV_PANEL_TRIAL_EXP_DAYS }}" | npx wrangler pages secret put IPTV_PANEL_TRIAL_EXP_DAYS --project-name=streamerstickpro-live
          fi
          if [ -n "${{ secrets.IPTV_PORTAL_URL }}" ]; then
            echo "${{ secrets.IPTV_PORTAL_URL }}" | npx wrangler pages secret put IPTV_PORTAL_URL --project-name=streamerstickpro-live
          fi
          if [ -n "${{ secrets.IPTV_PANEL_M3U_BASE }}" ]; then
            echo "${{ secrets.IPTV_PANEL_M3U_BASE }}" | npx wrangler pages secret put IPTV_PANEL_M3U_BASE --project-name=streamerstickpro-live
          fi
          if [ -n "${{ secrets.IPTV_PANEL_ADMIN_BASE }}" ]; then
            echo "${{ secrets.IPTV_PANEL_ADMIN_BASE }}" | npx wrangler pages secret put IPTV_PANEL_ADMIN_BASE --project-name=streamerstickpro-live
          fi
          if [ -n "${{ secrets.IPTV_PANEL_ADMIN_ACCESS_CODE }}" ]; then
            echo "${{ secrets.IPTV_PANEL_ADMIN_ACCESS_CODE }}" | npx wrangler pages secret put IPTV_PANEL_ADMIN_ACCESS_CODE --project-name=streamerstickpro-live
          fi
          if [ -n "${{ secrets.IPTV_PANEL_ADMIN_API_KEY }}" ]; then
            echo "${{ secrets.IPTV_PANEL_ADMIN_API_KEY }}" | npx wrangler pages secret put IPTV_PANEL_ADMIN_API_KEY --project-name=streamerstickpro-live
          fi
          if [ -n "${{ secrets.IPTV_PANEL_PRODUCT_MAP_JSON }}" ]; then
            echo "${{ secrets.IPTV_PANEL_PRODUCT_MAP_JSON }}" | npx wrangler pages secret put IPTV_PANEL_PRODUCT_MAP_JSON --project-name=streamerstickpro-live
          fi
          if [ -n "${{ secrets.IPTV_PANEL_BOUQUET_MAP_JSON }}" ]; then
            echo "${{ secrets.IPTV_PANEL_BOUQUET_MAP_JSON }}" | npx wrangler pages secret put IPTV_PANEL_BOUQUET_MAP_JSON --project-name=streamerstickpro-live
          fi
          if [ -n "${{ secrets.INTERNAL_CRON_SECRET }}" ]; then
            echo "${{ secrets.INTERNAL_CRON_SECRET }}" | npx wrangler pages secret put INTERNAL_CRON_SECRET --project-name=streamerstickpro-live
          fi
          # ── WordPress (Hostinger headless CMS) ──────────────────────────────
          # Configured in GitHub Actions secrets so deploys never lose the WP wiring.
          # Use one of: WP_REST_BASIC_AUTH (full Basic header) OR WP_APPLICATION_USER + WP_APPLICATION_PASSWORD.
          if [ -n "${{ secrets.WP_ORIGIN }}" ]; then
            echo "${{ secrets.WP_ORIGIN }}" | npx wrangler pages secret put WP_ORIGIN --project-name=streamerstickpro-live
          fi
          if [ -n "${{ secrets.WORDPRESS_URL }}" ]; then
            echo "${{ secrets.WORDPRESS_URL }}" | npx wrangler pages secret put WORDPRESS_URL --project-name=streamerstickpro-live
          fi
          if [ -n "${{ secrets.WP_HOME_PAGE_SLUG }}" ]; then
            echo "${{ secrets.WP_HOME_PAGE_SLUG }}" | npx wrangler pages secret put WP_HOME_PAGE_SLUG --project-name=streamerstickpro-live
          fi
          if [ -n "${{ secrets.WP_PRICING_PAGE_SLUG }}" ]; then
            echo "${{ secrets.WP_PRICING_PAGE_SLUG }}" | npx wrangler pages secret put WP_PRICING_PAGE_SLUG --project-name=streamerstickpro-live
          fi
          if [ -n "${{ secrets.WP_APPLICATION_USER }}" ]; then
            echo "${{ secrets.WP_APPLICATION_USER }}" | npx wrangler pages secret put WP_APPLICATION_USER --project-name=streamerstickpro-live
          fi
          if [ -n "${{ secrets.WP_APPLICATION_PASSWORD }}" ]; then
            echo "${{ secrets.WP_APPLICATION_PASSWORD }}" | npx wrangler pages secret put WP_APPLICATION_PASSWORD --project-name=streamerstickpro-live
          fi
          if [ -n "${{ secrets.WP_REST_BASIC_AUTH }}" ]; then
            echo "${{ secrets.WP_REST_BASIC_AUTH }}" | npx wrangler pages secret put WP_REST_BASIC_AUTH --project-name=streamerstickpro-live
          fi
          if [ -n "${{ secrets.SHADOW_HOSTS }}" ]; then
            echo "${{ secrets.SHADOW_HOSTS }}" | npx wrangler pages secret put SHADOW_HOSTS --project-name=streamerstickpro-live
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=streamerstickpro-live --branch=clean-main
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}

      - name: Wait for deployment propagation
        run: sleep 15

      - name: Post-deploy live smoke test
        continue-on-error: true
        run: npm run smoke:live
        env:
          SMOKE_LIVE_BASE: https://streamstickpro-live.pages.dev
