# Deploy to Cloudflare Pages + run Supabase SEO migrations + purge cache + ping sitemaps
# Required secrets: SUPABASE_DATABASE_URL (or DATABASE_URL), CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, SUPABASE_SERVICE_KEY, STRIPE_SECRET_KEY, STRIPE_PUBLISHABLE_KEY,
#   STRIPE_WEBHOOK_SECRET, RESEND_API_KEY, SESSION_SECRET. Optional: CLOUDFLARE_ZONE_ID (for cache purge).
name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - clean-main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Database Migration (Supabase SEO tables)
        run: npx tsx scripts/run-supabase-migration.ts
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true
      
      - name: Build for Cloudflare Workers
        run: npx tsx script/build-worker.ts
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SECURE_HOSTS: secure.streamstickpro.com
          VITE_STORAGE_BUCKET_NAME: imiges
          NODE_ENV: production
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=streamerstickpro-live --branch=clean-main
        env:
          NODE_ENV: production
          RESEND_FROM_EMAIL: noreply@streamstickpro.com
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SECURE_HOSTS: secure.streamstickpro.com
          VITE_STORAGE_BUCKET_NAME: imiges
          SITE_URL: https://streamstickpro.com

      - name: Purge Cloudflare cache (SEO: fresh sitemap & location pages)
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_ZONE_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Purging Cloudflare cache for fresh sitemap and location pages..."
            curl -sSf -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}' || true
          fi
        continue-on-error: true

      - name: Warm sitemap and notify search engines (Google, Bing, Yandex)
        run: |
          SITE="https://streamstickpro.com"
          SITEMAP="${SITE}/sitemap.xml"
          curl -sSf -o /dev/null "${SITEMAP}" || true
          curl -sSf -o /dev/null "https://www.bing.com/ping?sitemap=${SITEMAP}" || true
          curl -sSf -o /dev/null "https://www.google.com/ping?sitemap=${SITEMAP}" || true
          curl -sSf -o /dev/null "https://webmaster.yandex.com/ping?sitemap=${SITEMAP}" || true
        continue-on-error: true

      - name: Submit all sitemap URLs to IndexNow (Bing, Yandex, etc.)
        run: npx tsx scripts/indexnow-from-live-sitemap.ts
        env:
          SITE_URL: https://streamstickpro.com
        continue-on-error: true
