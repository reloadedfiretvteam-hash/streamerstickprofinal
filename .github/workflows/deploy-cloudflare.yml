# Deploy to Cloudflare Pages + run Supabase SEO migrations + purge cache + ping sitemaps
# DEPLOYMENT: clean-main ONLY. Do not add main or other branches.
# Required secrets: SUPABASE_DATABASE_URL (or DATABASE_URL), CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, SUPABASE_SERVICE_KEY, STRIPE_SECRET_KEY, STRIPE_PUBLISHABLE_KEY,
#   STRIPE_WEBHOOK_SECRET, RESEND_API_KEY, SESSION_SECRET. Optional: CLOUDFLARE_ZONE_ID (for cache purge).
name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - clean-main
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: false
        default: 'clean-main'
  schedule:
    # Run daily at 2 AM UTC so seed runs even without a push (e.g. after you add/fix secrets)
    - cron: '0 2 * * *'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.branch || 'clean-main') || (github.event_name == 'schedule' && 'clean-main' || github.ref) }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Database Migration (Supabase: SEO + visitor tracking)
        run: npx tsx scripts/run-supabase-migration.ts
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true

      - name: Migrate blog posts 2025 → 2026 (one-time year fix)
        run: npx tsx scripts/migrate-2025-to-2026.ts
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLL_KEY: ${{ secrets.SUPABASE_SERVICE_ROLL_KEY }}
        continue-on-error: true

      - name: Seed 400 new standalone SEO blog posts (jailbroken sticks, IPTV, cord-cutting, sports, cities)
        run: npx tsx scripts/seed-400-new-blogs.ts
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLL_KEY: ${{ secrets.SUPABASE_SERVICE_ROLL_KEY }}
        continue-on-error: true

      - name: Verify secrets for 25K seed (no values logged)
        run: |
          echo "Supabase URL set: $([ -n \"$VITE_SUPABASE_URL\" ] && echo yes || echo no)"
          echo "Service key (any) set: $([ -n \"$SUPABASE_SERVICE_KEY\" ] || [ -n \"$SUPABASE_SERVICE_ROLE_KEY\" ] || [ -n \"$SUPABASE_SERVICE_ROLL_KEY\" ] && echo yes || echo no)"
          echo "DATABASE_URL set: $([ -n \"$SUPABASE_DATABASE_URL\" ] || [ -n \"$DATABASE_URL\" ] && echo yes || echo no)"
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLL_KEY: ${{ secrets.SUPABASE_SERVICE_ROLL_KEY }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Seed 25K location pages (thousands of URLs for sitemap)
        id: seed25k
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLL_KEY: ${{ secrets.SUPABASE_SERVICE_ROLL_KEY }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -e
          HAS_URL="$([ -n "$VITE_SUPABASE_URL" ] && echo 1 || echo 0)"
          HAS_KEY="$([ -n "$SUPABASE_SERVICE_KEY" ] || [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -n "$SUPABASE_SERVICE_ROLL_KEY" ] && echo 1 || echo 0)"
          HAS_DB_URL="$([ -n "$SUPABASE_DATABASE_URL" ] || [ -n "$DATABASE_URL" ] && echo 1 || echo 0)"
          echo "Seed env: VITE_SUPABASE_URL=${HAS_URL}, service_key_any=${HAS_KEY}, DATABASE_URL_any=${HAS_DB_URL}"
          if [ "$HAS_URL" = "0" ] && [ "$HAS_DB_URL" = "0" ]; then
            echo "::warning:: 25K seed SKIPPED. Add VITE_SUPABASE_URL or SUPABASE_DATABASE_URL/DATABASE_URL."
            echo "seed_skipped=1" >> $GITHUB_OUTPUT
            echo "seed_message=25K seed SKIPPED (missing URL and DATABASE_URL)." >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "$HAS_KEY" = "1" ] && [ "$HAS_URL" = "1" ]; then
            echo "seed_skipped=0" >> $GITHUB_OUTPUT
            for attempt in 1 2; do
              echo "Running 25K seed (Supabase client) attempt $attempt..."
              if npx tsx scripts/seed-25k-location-pages.ts; then
                echo "seed_message=25K seed finished (Supabase client)." >> $GITHUB_OUTPUT
                exit 0
              fi
              echo "::warning:: Seed attempt $attempt failed, retrying..."
              sleep 10
            done
            echo "seed_message=25K seed failed after 2 attempts." >> $GITHUB_OUTPUT
            exit 1
          fi
          if [ "$HAS_DB_URL" = "1" ]; then
            echo "seed_skipped=0" >> $GITHUB_OUTPUT
            for attempt in 1 2; do
              echo "Running 25K seed (DATABASE_URL) attempt $attempt..."
              if npx tsx scripts/seed-25k-via-database-url.ts; then
                echo "seed_message=25K seed finished (DATABASE_URL)." >> $GITHUB_OUTPUT
                exit 0
              fi
              echo "::warning:: Seed attempt $attempt failed, retrying..."
              sleep 10
            done
            echo "seed_message=25K seed failed after 2 attempts." >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "::warning:: 25K seed SKIPPED. Add SUPABASE_SERVICE_KEY (and VITE_SUPABASE_URL) or SUPABASE_DATABASE_URL/DATABASE_URL."
          echo "seed_skipped=1" >> $GITHUB_OUTPUT
          echo "seed_message=25K seed SKIPPED (need service key + URL or DATABASE_URL)." >> $GITHUB_OUTPUT

      - name: Report 25K seed status (SEO URLs)
        if: always()
        run: |
          echo "## 25K location pages seed" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.seed25k.outputs.seed_skipped }}" = "1" ]; then
            echo "⚠️ **SKIPPED** – ${{ steps.seed25k.outputs.seed_message }}" >> $GITHUB_STEP_SUMMARY
            echo "To get **thousands of URLs** in your sitemap, add GitHub Secrets and re-run:" >> $GITHUB_STEP_SUMMARY
            echo "- \`VITE_SUPABASE_URL\` + \`SUPABASE_SERVICE_KEY\` (or \`SUPABASE_SERVICE_ROLE_KEY\`), **or** \`SUPABASE_DATABASE_URL\` / \`DATABASE_URL\` (same as migrations)" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.seed25k.outputs.seed_skipped }}" = "0" ]; then
            echo "✅ **RUN** – ${{ steps.seed25k.outputs.seed_message }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Step did not complete** (check logs above)." >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Build for Cloudflare Workers
        run: npx tsx script/build-worker.ts
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SECURE_HOSTS: secure.streamstickpro.com
          VITE_STORAGE_BUCKET_NAME: imiges
          NODE_ENV: production
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLL_KEY: ${{ secrets.SUPABASE_SERVICE_ROLL_KEY }}
          SUPABASE_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      # Env/secrets for the Worker are set only in Cloudflare Dashboard (Pages → streamerstickpro-live → Environment variables). This workflow does NOT sync or overwrite them.

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=streamerstickpro-live --branch=clean-main
        env:
          NODE_ENV: production
          RESEND_FROM_EMAIL: noreply@streamstickpro.com
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SECURE_HOSTS: secure.streamstickpro.com
          VITE_STORAGE_BUCKET_NAME: imiges
          SITE_URL: https://streamstickpro.com

      - name: Purge Cloudflare cache (SEO: fresh sitemap & location pages)
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_ZONE_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Purging Cloudflare cache for fresh sitemap and location pages..."
            curl -sSf -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}' || true
          fi
        continue-on-error: true

      - name: Wait for deploy to be live
        run: sleep 15

      - name: Verify sitemap and ping search engines (Google, Bing, Yandex, Yahoo)
        id: sitemap_verify
        run: |
          SITE="https://streamstickpro.com"
          SITEMAP_INDEX="${SITE}/sitemap-index.xml"
          SITEMAP="${SITE}/sitemap.xml"
          SITEMAP_PAGES="${SITE}/sitemap-pages.xml"
          echo "Fetching sitemaps (live after deploy)..."
          SITEMAP_BODY=$(curl -sSf -L --max-time 60 "$SITEMAP" || echo "")
          PAGES_BODY=$(curl -sSf -L --max-time 90 "$SITEMAP_PAGES" || echo "")
          URL_COUNT=$(echo "$SITEMAP_BODY" | grep -o '<loc>' | wc -l)
          PAGES_URL_COUNT=$(echo "$PAGES_BODY" | grep -o '<loc>' | wc -l)
          echo "## Sitemap verification" >> $GITHUB_STEP_SUMMARY
          echo "**sitemap.xml URLs:** $URL_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "**sitemap-pages.xml URLs:** $PAGES_URL_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "**Sitemap index:** $SITEMAP_INDEX" >> $GITHUB_STEP_SUMMARY
          echo "sitemap.xml: $URL_COUNT | sitemap-pages.xml: $PAGES_URL_COUNT"
          if [ "$URL_COUNT" -lt "10" ]; then
            echo "::warning:: sitemap.xml has very few URLs ($URL_COUNT). Check Cloudflare Pages env (Supabase) and build (location-pages.json)."
            echo "⚠️ **Low URL count** – indexing may be limited. Set Worker env in Cloudflare and ensure 25K seed or location-pages.json." >> $GITHUB_STEP_SUMMARY
          fi
          echo "Pinging Google, Bing, Yandex with all sitemaps..."
          curl -sSf -o /dev/null "https://www.google.com/ping?sitemap=${SITE}/sitemap-index.xml" && echo "Google: sitemap-index submitted" || true
          curl -sSf -o /dev/null "https://www.google.com/ping?sitemap=${SITE}/sitemap-posts.xml" && echo "Google: sitemap-posts submitted" || true
          curl -sSf -o /dev/null "https://www.google.com/ping?sitemap=${SITE}/sitemap-pages.xml" && echo "Google: sitemap-pages submitted" || true
          curl -sSf -o /dev/null "https://www.google.com/ping?sitemap=${SITE}/sitemap.xml" && echo "Google: sitemap.xml submitted" || true
          curl -sSf -o /dev/null "https://www.bing.com/ping?sitemap=${SITE}/sitemap-index.xml" && echo "Bing: submitted (Yahoo covered)" || true
          curl -sSf -o /dev/null "https://www.bing.com/ping?sitemap=${SITE}/sitemap-posts.xml" && echo "Bing: posts submitted" || true
          curl -sSf -o /dev/null "https://webmaster.yandex.com/ping?sitemap=${SITE}/sitemap-index.xml" && echo "Yandex: submitted" || true
          echo "## Search engine submission" >> $GITHUB_STEP_SUMMARY
          echo "- **Google:** sitemap ping" >> $GITHUB_STEP_SUMMARY
          echo "- **Bing:** sitemap ping (Yahoo uses Bing)" >> $GITHUB_STEP_SUMMARY
          echo "- **Yandex:** sitemap ping" >> $GITHUB_STEP_SUMMARY
          echo "- **IndexNow:** next step (Bing, Yandex, Seznam)" >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Live SEO smoke test (sample sitemap URLs)
        id: seo_smoke
        run: |
          echo "Running smoke test as Googlebot..."
          npx tsx scripts/live-seo-smoke.ts || true
          echo "Running smoke test as browser UA..."
          UA_PROFILE=browser npx tsx scripts/live-seo-smoke.ts || true
          echo "## Live SEO smoke test" >> $GITHUB_STEP_SUMMARY
          echo "Sampled sitemap URLs on production (status/canonical/meta/robots/schema). Ran twice: Googlebot + browser UA." >> $GITHUB_STEP_SUMMARY
        env:
          SITE_URL: https://streamstickpro.com
          SAMPLE: "600"
          TIMEOUT_MS: "15000"
          CONCURRENCY: "12"
        continue-on-error: true

      - name: Submit URLs to IndexNow (Bing, Yandex, Seznam, etc.)
        id: indexnow
        run: |
          npx tsx scripts/indexnow-from-live-sitemap.ts || true
          echo "## IndexNow" >> $GITHUB_STEP_SUMMARY
          echo "URLs from live sitemap submitted to IndexNow (Bing, Yandex, Seznam)." >> $GITHUB_STEP_SUMMARY
        env:
          SITE_URL: https://streamstickpro.com
          INDEXNOW_KEY: 3b1a52f5f41a4138b1f21c3265180f44
        continue-on-error: true
