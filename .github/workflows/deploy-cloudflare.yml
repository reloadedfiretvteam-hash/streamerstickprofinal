# Deploy to Cloudflare Pages + run Supabase SEO migrations + purge cache + ping sitemaps
# Required secrets: SUPABASE_DATABASE_URL (or DATABASE_URL), CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, SUPABASE_SERVICE_KEY, STRIPE_SECRET_KEY, STRIPE_PUBLISHABLE_KEY,
#   STRIPE_WEBHOOK_SECRET, RESEND_API_KEY, SESSION_SECRET. Optional: CLOUDFLARE_ZONE_ID (for cache purge).
name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - clean-main
  workflow_dispatch:
  schedule:
    # Run daily at 2 AM UTC so seed runs even without a push (e.g. after you add/fix secrets)
    - cron: '0 2 * * *'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Database Migration (Supabase SEO tables)
        run: npx tsx scripts/run-supabase-migration.ts
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true

      - name: Seed 25K location pages (thousands of URLs for sitemap)
        id: seed25k
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLL_KEY: ${{ secrets.SUPABASE_SERVICE_ROLL_KEY }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -e
          HAS_URL="$([ -n "$VITE_SUPABASE_URL" ] && echo 1 || echo 0)"
          HAS_KEY="$([ -n "$SUPABASE_SERVICE_KEY" ] || [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -n "$SUPABASE_SERVICE_ROLL_KEY" ] && echo 1 || echo 0)"
          HAS_DB_URL="$([ -n "$SUPABASE_DATABASE_URL" ] || [ -n "$DATABASE_URL" ] && echo 1 || echo 0)"
          echo "Seed env: VITE_SUPABASE_URL=${HAS_URL}, service_key_any=${HAS_KEY}, DATABASE_URL_any=${HAS_DB_URL}"
          if [ "$HAS_URL" = "0" ] && [ "$HAS_DB_URL" = "0" ]; then
            echo "::warning:: 25K seed SKIPPED. Add VITE_SUPABASE_URL or SUPABASE_DATABASE_URL/DATABASE_URL."
            echo "seed_skipped=1" >> $GITHUB_OUTPUT
            echo "seed_message=25K seed SKIPPED (missing URL and DATABASE_URL)." >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "$HAS_KEY" = "1" ] && [ "$HAS_URL" = "1" ]; then
            echo "seed_skipped=0" >> $GITHUB_OUTPUT
            echo "Running 25K seed (Supabase client)..."
            npx tsx scripts/seed-25k-location-pages.ts
            echo "seed_message=25K seed finished (Supabase client)." >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "$HAS_DB_URL" = "1" ]; then
            echo "seed_skipped=0" >> $GITHUB_OUTPUT
            echo "Running 25K seed (DATABASE_URL)..."
            npx tsx scripts/seed-25k-via-database-url.ts
            echo "seed_message=25K seed finished (DATABASE_URL)." >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "::warning:: 25K seed SKIPPED. Add SUPABASE_SERVICE_KEY (and VITE_SUPABASE_URL) or SUPABASE_DATABASE_URL/DATABASE_URL."
          echo "seed_skipped=1" >> $GITHUB_OUTPUT
          echo "seed_message=25K seed SKIPPED (need service key + URL or DATABASE_URL)." >> $GITHUB_OUTPUT

      - name: Report 25K seed status (SEO URLs)
        if: always()
        run: |
          echo "## 25K location pages seed" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.seed25k.outputs.seed_skipped }}" = "1" ]; then
            echo "⚠️ **SKIPPED** – ${{ steps.seed25k.outputs.seed_message }}" >> $GITHUB_STEP_SUMMARY
            echo "To get **thousands of URLs** in your sitemap, add GitHub Secrets and re-run:" >> $GITHUB_STEP_SUMMARY
            echo "- \`VITE_SUPABASE_URL\` + \`SUPABASE_SERVICE_KEY\` (or \`SUPABASE_SERVICE_ROLE_KEY\`), **or** \`SUPABASE_DATABASE_URL\` / \`DATABASE_URL\` (same as migrations)" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.seed25k.outputs.seed_skipped }}" = "0" ]; then
            echo "✅ **RUN** – ${{ steps.seed25k.outputs.seed_message }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Step did not complete** (check logs above)." >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Build for Cloudflare Workers
        run: npx tsx script/build-worker.ts
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SECURE_HOSTS: secure.streamstickpro.com
          VITE_STORAGE_BUCKET_NAME: imiges
          NODE_ENV: production
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLL_KEY: ${{ secrets.SUPABASE_SERVICE_ROLL_KEY }}
          SUPABASE_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=streamerstickpro-live --branch=clean-main
        env:
          NODE_ENV: production
          RESEND_FROM_EMAIL: noreply@streamstickpro.com
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SECURE_HOSTS: secure.streamstickpro.com
          VITE_STORAGE_BUCKET_NAME: imiges
          SITE_URL: https://streamstickpro.com

      - name: Purge Cloudflare cache (SEO: fresh sitemap & location pages)
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_ZONE_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Purging Cloudflare cache for fresh sitemap and location pages..."
            curl -sSf -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}' || true
          fi
        continue-on-error: true

      - name: Wait for deploy to be live
        run: sleep 15

      - name: Verify sitemap and ping search engines
        run: |
          SITE="https://streamstickpro.com"
          SITEMAP="${SITE}/sitemap.xml"
          echo "Fetching sitemap..."
          SITEMAP_BODY=$(curl -sSf -L "$SITEMAP" || echo "")
          URL_COUNT=$(echo "$SITEMAP_BODY" | grep -o '<loc>' | wc -l)
          echo "## Sitemap verification" >> $GITHUB_STEP_SUMMARY
          echo "**URLs in sitemap:** $URL_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "**Sitemap URL:** $SITEMAP" >> $GITHUB_STEP_SUMMARY
          echo "URLs in sitemap: $URL_COUNT"
          echo "Pinging Google, Bing, Yandex..."
          curl -sSf -o /dev/null "https://www.google.com/ping?sitemap=${SITEMAP}" && echo "Google: submitted" || true
          curl -sSf -o /dev/null "https://www.bing.com/ping?sitemap=${SITEMAP}" && echo "Bing: submitted" || true
          curl -sSf -o /dev/null "https://webmaster.yandex.com/ping?sitemap=${SITEMAP}" && echo "Yandex: submitted" || true
        continue-on-error: true

      - name: Submit URLs to IndexNow (Bing, Yandex, Seznam)
        run: npx tsx scripts/indexnow-from-live-sitemap.ts
        env:
          SITE_URL: https://streamstickpro.com
        continue-on-error: true
