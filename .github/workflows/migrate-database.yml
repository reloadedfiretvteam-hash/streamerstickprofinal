name: Run Database Migration

on:
  workflow_dispatch:
  push:
    branches:
      - clean-main
    paths:
      - 'scripts/run-supabase-migration.ts'
      - 'scripts/supabase-customer-auth-migration.sql'
      - 'shared/schema.ts'
      - 'supabase/migrations/**'

jobs:
  migrate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run Supabase Migration
        run: npx tsx scripts/run-supabase-migration.ts
        env:
          # Repo historically stored the URI as DATABASE_URL (not SUPABASE_DATABASE_URL).
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Apply Owner CMS Migration
        run: npx tsx scripts/apply-owner-cms-migration.ts
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      
      - name: Migration Summary
        run: |
          echo "## Migration Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Uses GitHub secrets \`DATABASE_URL\` and/or \`SUPABASE_DATABASE_URL\`." >> $GITHUB_STEP_SUMMARY
          echo "Runs \`scripts/run-supabase-migration.ts\` then \`scripts/apply-owner-cms-migration.ts\` (owner CMS tables)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Owner CMS tables:" >> $GITHUB_STEP_SUMMARY
          echo "- cms_homepage, cms_banners, cms_device_content, cms_plan_content, cms_guides" >> $GITHUB_STEP_SUMMARY
          echo "- cms_navigation, cms_brand_settings, cms_media_assets, cms_seo_metadata" >> $GITHUB_STEP_SUMMARY
          echo "- cms_content_revisions, cms_admin_audit_log, site_promotion (if missing)" >> $GITHUB_STEP_SUMMARY
